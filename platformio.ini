[env:lilygo-t-display]
platform = espressif32
board = lilygo-t-display
framework = arduino
monitor_speed = 115200
upload_speed  = 460800

board_build.partitions = no_ota.csv

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  bblanchon/ArduinoJson @ ^6.21.3
  
build_flags =
  -D USER_SETUP_LOADED
  -D ST7789_DRIVER
  -D ST7789_135X240
  -D TFT_WIDTH=135
  -D TFT_HEIGHT=240
  -D TFT_MOSI=19
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=16
  -D TFT_RST=-1
  -D TFT_BL=4
  -D TFT_BACKLIGHT_ON=1
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_ON
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  -D LOAD_FONT7
  -D LOAD_FONT8
  -D LOAD_GFXFF
  -D SMOOTH_FONT